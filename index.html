<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的背单词</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#1f232c; --line:#272b35;
    --fg:#e8eaed; --muted:#8b93a1; --acc:#4f8cff; --ok:#39d98a; --danger:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(15,17,21,.92);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  }
  h1{font-size:17px; margin:0 8px 0 0; white-space:nowrap}
  .stats{font-size:13px; color:var(--muted); margin-right:auto}
  .stats b{color:var(--acc)}
  input,select,textarea,button{font-family:inherit; font-size:14px}
  input[type=text],input[type=password],input:not([type]),select,textarea{
    background:var(--card2); border:1px solid var(--line); color:var(--fg);
    border-radius:8px; padding:7px 10px; outline:none;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--acc)}
  button{
    background:var(--card2); border:1px solid var(--line); color:var(--fg);
    border-radius:8px; padding:7px 12px; cursor:pointer; transition:.15s;
  }
  button:hover{background:#2a2f3a; border-color:#3a4150}
  button.primary{background:var(--acc); border-color:var(--acc); color:#fff}
  button.primary:hover{background:#3d7bf0}
  button.danger{color:var(--danger)}
  .panel{
    margin:12px 16px; padding:14px; background:var(--card); border:1px solid var(--line);
    border-radius:12px;
  }
  .panel h3{margin:0 0 10px; font-size:14px; color:var(--muted); font-weight:600}
  .panel textarea{width:100%; min-height:120px; resize:vertical; line-height:1.6}
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center}
  .grid2{display:grid; grid-template-columns:120px 1fr; gap:8px; align-items:center}
  .hint{font-size:12px; color:var(--muted); line-height:1.7}
  .hidden{display:none}
  #list{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    gap:12px; padding:16px; align-items:start;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px; transition:.2s; position:relative;
  }
  .card:hover{border-color:#39404f}
  .card.done{opacity:.55}
  .card.done .word{text-decoration:line-through; text-decoration-color:var(--ok)}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .word{
    font-size:22px; font-weight:700; letter-spacing:.3px; cursor:pointer;
    color:#fff; word-break:break-word;
  }
  .word:hover{color:var(--acc)}
  .phon{font-size:13px; color:var(--muted); margin-left:8px; font-weight:400}
  .spk{display:flex; gap:6px; flex-shrink:0}
  .spk button{padding:5px 9px; font-size:16px; line-height:1}
  .meaning{margin-top:10px; font-size:14px; line-height:1.7; color:#c9ced8}
  .tip{
    margin-top:9px; font-size:13px; line-height:1.7; color:#ffd88a;
    background:rgba(255,216,138,.07); border-left:3px solid #ffd88a;
    padding:7px 10px; border-radius:0 8px 8px 0;
  }
  .example{
    margin-top:9px; font-size:13px; line-height:1.7; color:#9fd8ff;
    background:rgba(79,140,255,.07); border-left:3px solid var(--acc);
    padding:7px 10px; border-radius:0 8px 8px 0;
  }
  .actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px}
  .actions button{font-size:12px; padding:5px 9px; border-radius:7px}
  .empty{text-align:center; color:var(--muted); padding:60px 20px; line-height:2}
  .toast{
    position:fixed; left:50%; bottom:32px; transform:translateX(-50%);
    background:#2a2f3a; border:1px solid var(--line); color:#fff;
    padding:10px 18px; border-radius:10px; font-size:14px; z-index:99;
    opacity:0; transition:.25s; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px)}
</style>
</head>
<body>

<header>
  <h1>📚 我的背单词</h1>
  <div class="stats">共 <b id="total">0</b> 词 · 已掌握 <b id="doneCount">0</b></div>
  <input id="search" placeholder="🔍 搜索" style="width:130px">
  <select id="filter">
    <option value="all">全部</option>
    <option value="new">未掌握</option>
    <option value="done">已掌握</option>
  </select>
  <button id="toggleImport" class="primary">➕ 导入</button>
  <button id="settingsBtn">⚙️ 设置</button>
</header>

<!-- 导入面板 -->
<div id="importPanel" class="panel hidden">
  <h3>导入单词（每行一个）</h3>
  <textarea id="importText" placeholder="支持以下格式，用英文或中文逗号分隔：
apple
apple, 苹果
apple, 苹果, 联想：a+pp+le
apple, 苹果, 记忆技巧, 例句"></textarea>
  <div class="row">
    <button id="importBtn" class="primary">导入</button>
    <label><input type="file" id="fileInput" accept=".txt,.csv" hidden>
      <span style="display:inline-block;padding:7px 12px;background:var(--card2);
      border:1px solid var(--line);border-radius:8px;cursor:pointer">📄 选择 txt/csv 文件</span></label>
    <button id="fetchAllBtn">🔍 批量查词典</button>
    <button id="exportBtn">💾 导出备份</button>
    <button id="clearBtn" class="danger">🗑️ 清空全部</button>
  </div>
  <div class="hint" style="margin-top:10px">
    提示：导入后点「批量查词典」可自动获取音标、英文释义和例句（免费 API，需要联网）。
  </div>
</div>

<!-- 设置面板 -->
<div id="settingsPanel" class="panel hidden">
  <h3>AI 记忆技巧设置（可选）</h3>
  <div class="grid2">
    <label>API 地址</label>
    <input id="cfgEndpoint" placeholder="https://api.openai.com/v1/chat/completions">
    <label>API Key</label>
    <input id="cfgKey" type="password" placeholder="sk-...">
    <label>模型</label>
    <input id="cfgModel" placeholder="gpt-4o-mini / deepseek-chat">
  </div>
  <div class="row">
    <button id="saveCfg" class="primary">保存</button>
    <span class="hint">也可填 DeepSeek：https://api.deepseek.com/v1/chat/completions</span>
  </div>
  <div class="hint" style="margin-top:8px">
    ⚠️ Key 只保存在你本地浏览器里，但请勿在公共电脑上使用。
  </div>
</div>

<div id="list"></div>

<div class="toast" id="toast"></div>
